
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modal Popup</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .open-btn {
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            background: white;
            color: #6741d9;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
            transition: 0.3s;
        }

        .open-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
        }

        #modalOverlay {
            display: none;
            position: fixed;
            inset: 0;
            padding: 20px;
            background: rgba(0, 0, 0, 0.55);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        #modal {
            width: 420px;
            max-width: 100%;
            padding: 35px;
            background: white;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
            animation: popup 0.3s ease;
        }

        .modal-icon {
            font-size: 45px;
            margin-bottom: 15px;
        }

        #modal h2 {
            color: #333;
            font-size: 28px;
            margin-bottom: 12px;
        }

        #modal p {
            color: #777;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .close-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 9px;
            background: #667eea;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .close-btn:hover {
            background: #5145cd;
        }

        @keyframes popup {
            from {
                opacity: 0;
                transform: translateY(-20px) scale(0.95);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @media (max-width: 450px) {
            #modal {
                padding: 28px 22px;
            }
        }
    </style>
</head>

<body>

    <button class="open-btn" onclick="openModal()">
        ✨ Open Modal
    </button>

    <div id="modalOverlay" onclick="closeOnOverlay(event)">

        <div id="modal">

            <div class="modal-icon">👋</div>

            <h2>Hello!</h2>

            <p>
                Welcome! This is a beautiful modal popup.
                Click the button below to close it.
            </p>

            <button class="close-btn" onclick="closeModal()">
                Close Popup ✕
            </button>

        </div>

    </div>

    <script>
        function openModal() {
            document.getElementById("modalOverlay").style.display = "flex";
        }

        function closeModal() {
            document.getElementById("modalOverlay").style.display = "none";
        }

        function closeOnOverlay(event) {
            if (event.target === document.getElementById("modalOverlay")) {
                closeModal();
            }
        }
    </script>

</body>
</html>
