
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pricing Table</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

    <div class="container my-5">

        <h1 class="text-center fw-bold mb-5">
            Pricing Plans
        </h1>

        <div class="row g-4">

            <div class="col-12 col-md-4">
                <div class="border rounded shadow p-4 text-center h-100">

                    <h3 class="fw-bold">Basic</h3>

                    <h2 class="text-primary fw-bold my-3">
                        ₹199
                    </h2>

                    <p class="text-muted">
                        Per Month
                    </p>

                    <p>✔ 5 Projects</p>
                    <p>✔ 10 GB Storage</p>
                    <p>✔ Email Support</p>

                    <button class="btn btn-primary w-100 mt-3">
                        Choose Plan
                    </button>

                </div>
            </div>


            <div class="col-12 col-md-4">
                <div class="border border-primary rounded shadow p-4 text-center h-100">

                    <h3 class="fw-bold">Standard</h3>

                    <h2 class="text-success fw-bold my-3">
                        ₹499
                    </h2>

                    <p class="text-muted">
                        Per Month
                    </p>

                    <p>✔ 15 Projects</p>
                    <p>✔ 50 GB Storage</p>
                    <p>✔ Priority Support</p>

                    <button class="btn btn-success w-100 mt-3">
                        Choose Plan
                    </button>

                </div>
            </div>


            <div class="col-12 col-md-4">
                <div class="border rounded shadow p-4 text-center h-100">

                    <h3 class="fw-bold">Premium</h3>

                    <h2 class="text-danger fw-bold my-3">
                        ₹999
                    </h2>

                    <p class="text-muted">
                        Per Month
                    </p>

                    <p>✔ Unlimited Projects</p>
                    <p>✔ 100 GB Storage</p>
                    <p>✔ 24/7 Support</p>

                    <button class="btn btn-danger w-100 mt-3">
                        Choose Plan
                    </button>

                </div>
            </div>

        </div>

    </div>

</body>
</html>
