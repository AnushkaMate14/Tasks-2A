<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Bootstrap Icons</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
  </head>

  <body>
    <div class="container my-5">
      <h1 class="text-center mb-5">Bootstrap Icons</h1>

      <div class="text-center mb-5">
        <button class="btn btn-primary me-2">
          <i class="bi bi-house"></i>
          Home
        </button>

        <button class="btn btn-success me-2">
          <i class="bi bi-person"></i>
          Profile
        </button>

        <button class="btn btn-danger">
          <i class="bi bi-trash"></i>
          Delete
        </button>
      </div>

      <div class="input-group mb-4">
        <span class="input-group-text">
          <i class="bi bi-search"></i>
        </span>

        <input type="text" class="form-control" placeholder="Search" />
      </div>

      <div class="row g-4">
        <div class="col-12 col-md-4">
          <div class="card text-center p-4">
            <i class="bi bi-house-door-fill fs-1 text-primary"></i>

            <h4 class="mt-3">Home</h4>

            <p>Go to the homepage.</p>

            <button class="btn btn-primary">Visit</button>
          </div>
        </div>

        <div class="col-12 col-md-4">
          <div class="card text-center p-4">
            <i class="bi bi-person-circle fs-1 text-success"></i>

            <h4 class="mt-3">Profile</h4>

            <p>View your profile.</p>

            <button class="btn btn-success">View Profile</button>
          </div>
        </div>

        <div class="col-12 col-md-4">
          <div class="card text-center p-4">
            <i class="bi bi-gear-fill fs-1 text-warning"></i>

            <h4 class="mt-3">Settings</h4>

            <p>Manage your settings.</p>

            <button class="btn btn-warning">Settings</button>
          </div>
        </div>
      </div>

      <div class="mt-5 p-4 bg-light text-center">
        <h3>
          <i class="bi bi-envelope-fill"></i>
          Contact Us
        </h3>

        <p>
          <i class="bi bi-telephone-fill"></i>
          +91 9876543210
        </p>

        <p>
          <i class="bi bi-envelope"></i>
          example@gmail.com
        </p>
      </div>
    </div>
  </body>
</html>
