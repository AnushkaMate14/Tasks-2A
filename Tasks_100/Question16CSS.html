<!-- 16. Position Build a sticky navbar with shadow on scroll. -->
 <!DOCTYPE html>
<html>
<head>
    <title>Sticky Navbar</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            overflow-x: hidden;
        }

        nav {
            position: sticky;
            top: 0;
            background-color: black;
            padding: 15px;
        }

        nav a {
            margin: 15px;
            text-decoration: none;
            color: white;
        }

        .content {
            height: 1000px;
            padding: 30px;
        }
    </style>
</head>

<body>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>

    <div class="content">
        <h1>My Website</h1>
        <p>Scroll down to see the sticky navbar.</p>
    <div class="gallery">
      <div class="image-card">
        <img
          src="https://upload.wikimedia.org/wikipedia/commons/e/e7/Everest_North_Face_toward_Base_Camp_Tibet_Luca_Galuzzi_2006.jpg?utm_source=en.wikipedia.org&utm_campaign=index&utm_content=original"
          alt="Snow-covered mountains under a clear blue sky"
        />

        <p>Mountains</p>
      </div>
</div>
</body>
</html>
