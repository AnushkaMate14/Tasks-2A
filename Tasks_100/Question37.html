
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter App</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .counter-box {
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            width: 320px;
        }

        h2 {
            color: #333;
            margin-bottom: 25px;
        }

        #count {
            font-size: 60px;
            color: #667eea;
            margin-bottom: 30px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            border: none;
            padding: 12px 18px;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            color: white;
            transition: 0.3s;
        }

        .increase {
            background: #22c55e;
        }

        .decrease {
            background: #ef4444;
        }

        .reset {
            background: #667eea;
        }

        button:hover {
            transform: translateY(-3px);
            opacity: 0.9;
        }
    </style>
</head>

<body>

    <div class="counter-box">
        <h2>Counter App</h2>

        <h1 id="count">0</h1>

        <div class="buttons">
            <button class="decrease" onclick="decrement()">−</button>
            <button class="increase" onclick="increment()">+</button>
            <button class="reset" onclick="reset()">Reset</button>
        </div>
    </div>

    <script>
        let count = 0;

        function increment() {
            count++;
            document.getElementById("count").innerText = count;
        }

        function decrement() {
            count--;
            document.getElementById("count").innerText = count;
        }

        function reset() {
            count = 0;
            document.getElementById("count").innerText = count;
        }
    </script>

</body>
</html>
