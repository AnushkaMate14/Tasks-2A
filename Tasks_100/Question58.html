<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAQ Accordion</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .container {
            width: 600px;
            max-width: 100%;
            padding: 35px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }

        h2 {
            text-align: center;
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .description {
            text-align: center;
            color: #888;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .faq-item {
            margin-bottom: 12px;
            border: 1px solid #e8e3f5;
            border-radius: 12px;
            overflow: hidden;
            background: #faf9ff;
        }

        .question {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 18px;
            cursor: pointer;
            background: #f7f5ff;
            border: none;
            color: #444;
            font-size: 15px;
            font-weight: bold;
            text-align: left;
            transition: 0.3s;
        }

        .question:hover,
        .question.open {
            background: #eee9ff;
            color: #6546a5;
        }

        .icon {
            font-size: 22px;
            color: #764ba2;
            flex-shrink: 0;
        }

        .answer {
            display: none;
            padding: 0 18px 18px;
            color: #666;
            font-size: 14px;
            line-height: 1.8;
            background: #fff;
            animation: fadeIn 0.3s ease;
        }

        .answer.show {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 25px 18px;
            }

            h2 {
                font-size: 24px;
            }

            .question {
                padding: 15px;
                font-size: 14px;
            }

            .answer {
                padding: 0 15px 15px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>Frequently Asked Questions</h2>

        <p class="description">
            Find answers to some common questions below.
        </p>

        <div class="faq-item">
            <button class="question">
                What is HTML?
                <span class="icon">+</span>
            </button>

            <div class="answer">
                HTML is used to create the structure of a webpage.
            </div>
        </div>

        <div class="faq-item">
            <button class="question">
                What is CSS?
                <span class="icon">+</span>
            </button>

            <div class="answer">
                CSS is used to style a webpage and control its layout, colors, and appearance.
            </div>
        </div>

        <div class="faq-item">
            <button class="question">
                What is JavaScript?
                <span class="icon">+</span>
            </button>

            <div class="answer">
                JavaScript is used to add functionality and interaction to webpages.
            </div>
        </div>

    </div>

    <script>
        let questions = document.querySelectorAll(".question");

        questions.forEach(function(question) {

            question.addEventListener("click", function() {

                let answer = question.nextElementSibling;
                let icon = question.querySelector(".icon");

                answer.classList.toggle("show");
                question.classList.toggle("open");

                if (answer.classList.contains("show")) {
                    icon.innerText = "−";
                } else {
                    icon.innerText = "+";
                }

            });

        });
    </script>

</body>
</html>
