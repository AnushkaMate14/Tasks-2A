<!DOCTYPE html>
<html>
<head>
    <title>Callback Loading</title>
</head>
<body>

    <h2 id="message">Loading...</h2>

    <script>
        function loadData(callback) {

            setTimeout(function () {
                callback();
            }, 4000);

        }

        function showData() {
            document.getElementById("message").innerText =
                "Data Loaded Successfully!";
        }

        loadData(showData);
    </script>

</body>
</html>
