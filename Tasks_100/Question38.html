
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Callback Loading</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .loading-card {
            background: white;
            padding: 40px;
            width: 350px;
            text-align: center;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        h2 {
            color: #333;
            margin-bottom: 25px;
        }

        .loader {
            width: 45px;
            height: 45px;
            border: 5px solid #e5e7eb;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px;
        }

        #message {
            color: #667eea;
            font-size: 17px;
        }

        .success .loader {
            display: none;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <div class="loading-card" id="card">
        <h2>Callback Loading</h2>

        <div class="loader"></div>

        <h3 id="message">Loading data...</h3>
    </div>

    <script>
        function loadData(callback) {
            setTimeout(function () {
                callback();
            }, 4000);
        }

        function showData() {
            document.getElementById("message").innerText =
                "✓ Data Loaded Successfully!";

            document.getElementById("card").classList.add("success");
        }

        loadData(showData);
    </script>

</body>
</html>
