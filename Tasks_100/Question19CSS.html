<!DOCTYPE html>
<html>
<head>
    <title>FAQ Accordion</title>

    <style>
        body {
            font-family: Arial;
            padding: 30px;
        }

        .faq {
            width: 500px;
            margin: auto;
        }

        details {
            margin-bottom: 10px;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        summary {
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="faq">

        <details>
            <summary>What is HTML?</summary>
            <p>HTML is used to create the structure of web pages.</p>
        </details>

        <details>
            <summary>What is CSS?</summary>
            <p>CSS is used to style and design web pages.</p>
        </details>

        <details>
            <summary>What is JavaScript?</summary>
            <p>JavaScript is used to add interactivity to web pages.</p>
        </details>

    </div>

</body>
</html>
