
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Student Table</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .container {
            width: 600px;
            max-width: 100%;
            padding: 35px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }

        .icon {
            text-align: center;
            font-size: 45px;
            margin-bottom: 12px;
        }

        h2 {
            text-align: center;
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .description {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        input {
            flex: 1;
            min-width: 0;
            padding: 13px;
            border: 2px solid #ddd;
            border-radius: 9px;
            outline: none;
            font-size: 15px;
            transition: 0.3s;
        }

        input:focus {
            border-color: #667eea;
            box-shadow: 0 0 7px rgba(102, 126, 234, 0.2);
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .add-btn {
            background: #667eea;
            color: white;
            white-space: nowrap;
        }

        .add-btn:hover {
            background: #5145cd;
            transform: translateY(-2px);
        }

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
            border-radius: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            overflow: hidden;
        }

        thead {
            background: #667eea;
            color: white;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        th {
            font-size: 14px;
            letter-spacing: 0.3px;
        }

        tbody tr {
            background: #fafaff;
            transition: 0.2s;
        }

        tbody tr:hover {
            background: #f0edff;
        }

        td {
            color: #444;
            font-size: 14px;
            overflow-wrap: anywhere;
        }

        .delete-btn {
            background: #fee2e2;
            color: #dc2626;
        }

        .delete-btn:hover {
            background: #dc2626;
            color: white;
        }

        #message {
            display: none;
            margin-bottom: 15px;
            padding: 11px;
            border-radius: 8px;
            font-size: 13px;
        }

        .error {
            display: block !important;
            background: #fee2e2;
            color: #dc2626;
        }

        .empty-row {
            text-align: center;
            color: #999;
            padding: 20px;
        }

        @media (max-width: 500px) {
            .container {
                padding: 25px 18px;
            }

            .input-group {
                flex-direction: column;
            }

            .add-btn {
                width: 100%;
            }

            th, td {
                padding: 11px 8px;
            }

            h2 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="icon">🎓</div>

        <h2>Student Table</h2>

        <p class="description">
            Add student names and manage your student list easily.
        </p>

        <div class="input-group">
            <input type="text" id="name" placeholder="Enter student name">
            <button class="add-btn" onclick="addRow()">+ Add Student</button>
        </div>

        <p id="message"></p>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Student Name</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="studentTable">
                    <tr id="emptyRow">
                        <td colspan="2" class="empty-row">
                            No students added yet.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>

    <script>
        function addRow() {

            let input = document.getElementById("name");
            let name = input.value.trim();
            let message = document.getElementById("message");

            if (name === "") {
                message.innerText = "Please enter a student name!";
                message.className = "error";
                return;
            }

            message.innerText = "";
            message.className = "";

            let emptyRow = document.getElementById("emptyRow");

            if (emptyRow) {
                emptyRow.remove();
            }

            let row = document.createElement("tr");

            let nameCell = document.createElement("td");
            nameCell.innerText = name;

            let actionCell = document.createElement("td");

            let deleteButton = document.createElement("button");
            deleteButton.innerText = "Delete";
            deleteButton.className = "delete-btn";

            deleteButton.onclick = function () {
                row.remove();

                let table = document.getElementById("studentTable");

                if (table.querySelectorAll("tr").length === 0) {
                    table.innerHTML = `
                        <tr id="emptyRow">
                            <td colspan="2" class="empty-row">
                                No students added yet.
                            </td>
                        </tr>
                    `;
                }
            };

            actionCell.appendChild(deleteButton);

            row.appendChild(nameCell);
            row.appendChild(actionCell);

            document.getElementById("studentTable").appendChild(row);

            input.value = "";
            input.focus();
        }
    </script>

</body>
</html>
