<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Show Hide Password</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .container {
            width: 400px;
            max-width: 100%;
            padding: 40px 30px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .icon {
            font-size: 50px;
            margin-bottom: 15px;
        }

        h2 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .description {
            color: #888;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .password-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        #password {
            width: 100%;
            min-width: 0;
            padding: 13px;
            border: 2px solid #ddd;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
            transition: 0.3s;
        }

        #password:focus {
            border-color: #667eea;
            box-shadow: 0 0 8px rgba(102, 126, 234, 0.2);
        }

        button {
            padding: 13px 18px;
            border: none;
            border-radius: 10px;
            background: #667eea;
            color: white;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #5145cd;
            transform: translateY(-2px);
        }

        .footer {
            color: #aaa;
            font-size: 12px;
            margin-top: 15px;
        }

        @media (max-width: 400px) {
            .container {
                padding: 30px 20px;
            }

            .password-box {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="icon">🔐</div>

        <h2>Welcome Back!</h2>

        <p class="description">Enter your password to continue.</p>

        <div class="password-box">
            <input
                type="password"
                id="password"
                placeholder="Enter Password"
            >

            <button id="toggleButton" onclick="showPassword()">
                Show
            </button>
        </div>

        <p class="footer">Keep your password safe 🔒</p>

    </div>

    <script>
        function showPassword() {

            let password = document.getElementById("password");
            let button = document.getElementById("toggleButton");

            if (password.type === "password") {
                password.type = "text";
                button.innerText = "Hide";
            } else {
                password.type = "password";
                button.innerText = "Show";
            }

        }
    </script>

</body>
</html>
