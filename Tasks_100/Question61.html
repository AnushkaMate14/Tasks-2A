
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Dropdown</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .container {
            width: 400px;
            max-width: 100%;
            padding: 40px 30px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        h2 {
            color: #333;
            font-size: 27px;
            margin-bottom: 10px;
        }

        .description {
            color: #888;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .dropdown {
            position: relative;
            width: 100%;
            text-align: left;
        }

        #dropdownBtn {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: #f8f7ff;
            color: #555;
            border: 2px solid #e5def8;
            border-radius: 10px;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
        }

        #dropdownBtn:hover,
        #dropdownBtn.open {
            border-color: #8b70d6;
            color: #6546a5;
        }

        .arrow {
            transition: transform 0.3s;
        }

        #dropdownBtn.open .arrow {
            transform: rotate(180deg);
        }

        #menu {
            display: none;
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            width: 100%;
            padding: 6px;
            background: white;
            border: 1px solid #e5def8;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.12);
            z-index: 10;
        }

        #menu.show {
            display: block;
            animation: slideDown 0.2s ease;
        }

        #menu div {
            padding: 13px;
            margin-bottom: 3px;
            color: #555;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }

        #menu div:last-child {
            margin-bottom: 0;
        }

        #menu div:hover {
            background: #f0ebff;
            color: #6546a5;
            padding-left: 18px;
        }

        #menu div.selected {
            background: #eee8ff;
            color: #6546a5;
            font-weight: bold;
        }

        #result {
            margin-top: 25px;
            padding: 12px;
            background: #f3f0ff;
            color: #6546a5;
            border-radius: 10px;
            font-size: 14px;
        }

        .footer {
            margin-top: 20px;
            color: #aaa;
            font-size: 12px;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 400px) {
            .container {
                padding: 30px 20px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="icon">📋</div>

        <h2>Custom Dropdown</h2>

        <p class="description">
            Choose your favourite web development technology.
        </p>

        <div class="dropdown">

            <button id="dropdownBtn">
                <span id="buttonText">Select Option</span>
                <span class="arrow">▼</span>
            </button>

            <div id="menu">
                <div>HTML</div>
                <div>CSS</div>
                <div>JavaScript</div>
                <div>Bootstrap</div>
            </div>

        </div>

        <p id="result">Your selected option will appear here.</p>

        <p class="footer">Select an option to get started ✨</p>

    </div>

    <script>
        let button = document.getElementById("dropdownBtn");
        let menu = document.getElementById("menu");
        let buttonText = document.getElementById("buttonText");
        let result = document.getElementById("result");

        button.addEventListener("click", function() {

            menu.classList.toggle("show");
            button.classList.toggle("open");

        });

        let options = menu.querySelectorAll("div");

        options.forEach(function(option) {

            option.addEventListener("click", function() {

                buttonText.innerText = option.innerText;
                result.innerText = "Selected Option: " + option.innerText;

                options.forEach(function(item) {
                    item.classList.remove("selected");
                });

                option.classList.add("selected");

                menu.classList.remove("show");
                button.classList.remove("open");

            });

        });

        document.addEventListener("click", function(event) {

            if (!event.target.closest(".dropdown")) {
                menu.classList.remove("show");
                button.classList.remove("open");
            }

        });
    </script>

</body>
</html>
