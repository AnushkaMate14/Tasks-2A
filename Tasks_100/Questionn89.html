
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD API Project</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
            background: #f4f4f4;
        }

        h1 {
            text-align: center;
        }

        form, .post-card {
            background: white;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 8px;
        }

        input, textarea, button {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
        }

        button {
            cursor: pointer;
            border: none;
            background: #2563eb;
            color: white;
            border-radius: 5px;
        }

        .post-card button {
            width: auto;
            padding: 8px 15px;
        }

        .delete-btn {
            background: #dc2626;
        }
    </style>
</head>
<body>

    <h1>CRUD API Application</h1>

    <form id="postForm">
        <h2 id="formHeading">Create Post</h2>

        <input type="text" id="title" placeholder="Enter post title" required>

        <textarea id="body" placeholder="Enter post description" required></textarea>

        <button type="submit" id="submitBtn">Add Post</button>
    </form>

    <h2>All Posts</h2>

    <div id="message"></div>
    <div id="postsContainer"></div>

    <script>


let apiURL = "https://jsonplaceholder.typicode.com/posts";

let postForm = document.getElementById("postForm");
let titleInput = document.getElementById("title");
let bodyInput = document.getElementById("body");
let formHeading = document.getElementById("formHeading");
let submitBtn = document.getElementById("submitBtn");
let postsContainer = document.getElementById("postsContainer");
let message = document.getElementById("message");

let editId = null;
let allPosts = [];

// READ: Fetch all posts
async function getPosts() {
    try {
        message.innerText = "Loading posts...";

        let response = await fetch(apiURL);

        if (!response.ok) {
            throw new Error("Failed to fetch posts");
        }

        allPosts = await response.json();
        displayPosts();

        message.innerText = `Total posts: ${allPosts.length}`;

    } catch (error) {
        message.innerText = error.message;
    }
}

function displayPosts() {
    postsContainer.innerHTML = "";

    allPosts.forEach(post => {
        let card = document.createElement("div");
        card.className = "post-card";
        card.id = `post-${post.id}`;

        let heading = document.createElement("h3");
        heading.innerText = post.title;

        let description = document.createElement("p");
        description.innerText = post.body;

        let editButton = document.createElement("button");
        editButton.innerText = "Edit";
        editButton.onclick = () => editPost(post.id);

        let deleteButton = document.createElement("button");
        deleteButton.innerText = "Delete";
        deleteButton.className = "delete-btn";
        deleteButton.onclick = () => deletePost(post.id);

        card.append(heading, description, editButton, deleteButton);
        postsContainer.appendChild(card);
    });
}

// CREATE: Add post
// UPDATE: Edit post
postForm.addEventListener("submit", async function (event) {
    event.preventDefault();

    let postData = {
        title: titleInput.value.trim(),
        body: bodyInput.value.trim(),
        userId: 1
    };

    if (!postData.title || !postData.body) {
        message.innerText = "Please fill in all fields.";
        return;
    }

    try {
        let isEditing = editId !== null;

        let response = await fetch(
            isEditing ? `${apiURL}/${editId}` : apiURL,
            {
                method: isEditing ? "PUT" : "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(postData)
            }
        );

        if (!response.ok) {
            throw new Error("Operation failed");
        }

        let result = await response.json();

        if (isEditing) {
            allPosts = allPosts.map(post =>
                post.id === editId ? { ...post, ...postData } : post
            );

            message.innerText = "Post updated successfully!";
        } else {
            let newPost = {
                ...postData,
                id: result.id || Date.now()
            };

            allPosts.unshift(newPost);
            message.innerText = "Post added successfully!";
        }

        displayPosts();

        postForm.reset();
        editId = null;
        formHeading.innerText = "Create Post";
        submitBtn.innerText = "Add Post";

    } catch (error) {
        message.innerText = error.message;
    }
});

// EDIT: Load post into form
async function editPost(id) {
    try {
        let response = await fetch(`${apiURL}/${id}`);

        if (!response.ok) {
            throw new Error("Failed to fetch post");
        }

        let post = await response.json();

        titleInput.value = post.title;
        bodyInput.value = post.body;

        editId = id;
        formHeading.innerText = "Edit Post";
        submitBtn.innerText = "Update Post";

        postForm.scrollIntoView({ behavior: "smooth" });

    } catch (error) {
        message.innerText = error.message;
    }
}

// DELETE: Delete post
async function deletePost(id) {
    if (!confirm("Are you sure you want to delete this post?")) {
        return;
    }

    try {
        let response = await fetch(`${apiURL}/${id}`, {
            method: "DELETE"
        });

        if (!response.ok) {
            throw new Error("Failed to delete post");
        }

        let card = document.getElementById(`post-${id}`);

        if (card) {
            card.remove();
        }

        message.innerText = "Post deleted successfully!";

    } catch (error) {
        message.innerText = error.message;
    }
}

// Load posts when page opens
getPosts();  
 </script>

</body>
</html>
