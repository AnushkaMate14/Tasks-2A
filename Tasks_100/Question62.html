
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            padding: 40px 20px;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .container {
            max-width: 850px;
            margin: auto;
        }

        h1 {
            text-align: center;
            color: white;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #eee8ff;
            margin-bottom: 35px;
            font-size: 14px;
        }

        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        .product, .cart {
            padding: 28px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.15);
        }

        .product-image {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 170px;
            background: #f3f0ff;
            border-radius: 12px;
            font-size: 85px;
            margin-bottom: 22px;
        }

        .tag {
            display: inline-block;
            padding: 6px 10px;
            background: #eee8ff;
            color: #6546a5;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        h2 {
            color: #333;
            font-size: 23px;
            margin-bottom: 12px;
        }

        h3 {
            color: #333;
            font-size: 20px;
            margin-bottom: 10px;
        }

        .description {
            color: #888;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 18px;
        }

        .price {
            color: #6546a5;
            font-size: 25px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        button {
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .add-button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border-radius: 10px;
            font-size: 15px;
        }

        .add-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .cart-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 25px;
        }

        .cart-header h2 {
            margin: 0;
        }

        .cart-count {
            padding: 7px 11px;
            background: #eee8ff;
            color: #6546a5;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
        }

        .cart-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 15px 0;
            border-bottom: 1px solid #eee;
        }

        .cart-item-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 55px;
            height: 55px;
            flex-shrink: 0;
            background: #f3f0ff;
            border-radius: 10px;
            font-size: 30px;
        }

        .item-details {
            flex: 1;
        }

        .item-details h3 {
            font-size: 15px;
            margin-bottom: 6px;
        }

        .item-details p {
            color: #888;
            font-size: 13px;
        }

        .quantity-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 15px;
        }

        .quantity-controls button {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: #eee8ff;
            color: #6546a5;
            font-size: 20px;
        }

        .quantity-controls button:hover {
            background: #6546a5;
            color: white;
        }

        #quantity {
            min-width: 20px;
            text-align: center;
            font-weight: bold;
            color: #333;
        }

        .empty-cart {
            padding: 25px 0;
            text-align: center;
            color: #999;
            font-size: 14px;
            line-height: 1.8;
        }

        .empty-cart span {
            display: block;
            font-size: 42px;
            margin-bottom: 10px;
        }

        .cart-summary {
            margin-top: 22px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            color: #777;
            font-size: 14px;
        }

        .summary-row.total {
            color: #333;
            font-size: 18px;
            font-weight: bold;
        }

        #total {
            color: #6546a5;
            font-size: 24px;
        }

        .footer {
            text-align: center;
            color: #eee8ff;
            font-size: 12px;
            margin-top: 25px;
        }

        @media (max-width: 650px) {
            .content {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 27px;
            }

            .product, .cart {
                padding: 22px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🛍️ Shopping Cart</h1>

        <p class="subtitle">
            A simple shopping experience
        </p>

        <div class="content">

            <!-- Product Card -->
            <div class="product">

                <div class="product-image">👕</div>

                <span class="tag">BESTSELLER</span>

                <h2>Classic T-Shirt</h2>

                <p class="description">
                    Comfortable, stylish and perfect for everyday wear.
                </p>

                <p class="price">₹500</p>

                <button class="add-button" onclick="addToCart()">
                    + Add to Cart
                </button>

            </div>

            <!-- Shopping Cart -->
            <div class="cart">

                <div class="cart-header">
                    <h2>Your Cart</h2>
                    <span class="cart-count">
                        Items: <span id="cartCount">0</span>
                    </span>
                </div>

                <div id="cartContent">

                    <div class="empty-cart">
                        <span>🛒</span>
                        Your cart is empty.<br>
                        Add a product to get started!
                    </div>

                </div>

                <div class="cart-summary">

                    <div class="summary-row">
                        <span>Price per item</span>
                        <span>₹500</span>
                    </div>

                    <div class="summary-row">
                        <span>Quantity</span>
                        <span id="quantity">0</span>
                    </div>

                    <div class="summary-row total">
                        <span>Total Amount</span>
                        <span>₹<span id="total">0</span></span>
                    </div>

                </div>

            </div>

        </div>

        <p class="footer">
            Shopping made simple ✨
        </p>

    </div>

    <script>
        let quantity = 0;
        let price = 500;

        function addToCart() {
            quantity++;
            updateCart();
        }

        function increase() {
            quantity++;
            updateCart();
        }

        function decrease() {
            if (quantity > 0) {
                quantity--;
                updateCart();
            }
        }

        function updateCart() {

            document.getElementById("quantity").innerText = quantity;

            document.getElementById("total").innerText =
                quantity * price;

            document.getElementById("cartCount").innerText = quantity;

            let cartContent = document.getElementById("cartContent");

            if (quantity === 0) {

                cartContent.innerHTML = `
                    <div class="empty-cart">
                        <span>🛒</span>
                        Your cart is empty.<br>
                        Add a product to get started!
                    </div>
                `;

            } else {

                cartContent.innerHTML = `
                    <div class="cart-item">

                        <div class="cart-item-icon">👕</div>

                        <div class="item-details">
                            <h3>Classic T-Shirt</h3>
                            <p>₹${price} per item</p>

                            <div class="quantity-controls">
                                <button onclick="decrease()">−</button>
                                <span id="itemQuantity">${quantity}</span>
                                <button onclick="increase()">+</button>
                            </div>
                        </div>

                    </div>
                `;

            }
        }
    </script>

</body>
</html>
