<!-- 12. CSS Transitions Add smooth hover transitions to buttons and cards.-->
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Transitions</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f4f4;
            padding: 40px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }
        .cards {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .card {
            width: 250px;
            padding: 25px;
            background-color: white;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            transition: 0.30s;
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.3);
        }
        button {
            margin-top: 20px;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            background-color: #007bff;
            color: white;
            cursor: pointer;
            transition: 0.30s;
        }

        button:hover {
            background-color: #0056b3;
            transform: scale(1.05);
        }

    </style>

</head>

<body>

    <h1>CSS Transition Example</h1>

    <div class="cards">

        <div class="card">
            <h2>Card 1</h2>
            <p>This is the first card.</p>
            <button>Read More</button>
        </div>

        <div class="card">
            <h2>Card 2</h2>
            <p>This is the second card.</p>
            <button>Read More</button>
        </div>

        <div class="card">
            <h2>Card 3</h2>
            <p>This is the third card.</p>
            <button>Read More</button>
        </div>

    </div>

</body>

</html>
