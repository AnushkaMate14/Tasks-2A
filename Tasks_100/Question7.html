<!-- 7.ARIA Roles - Create an accessible login modal popup using role="dialog". -->
 <!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Accessible Login Modal</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f4f4;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-button {
            padding: 12px 25px;
            background-color: #0f4c81;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        .login-button:hover {
            background-color: #083358;
        }
        .modal {
            position: fixed;
            inset: 0;

            background-color: rgba(0, 0, 0, 0.6);

            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-dialog {
            width: 400px;
            background-color: white;

            padding: 30px;

            border-radius: 10px;

            box-shadow: 0 0 15px rgba(0, 0, 0, 0.3);

            position: relative;
        }

        .login-dialog h2 {
            text-align: center;
            color: #0f4c81;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;

            margin-top: 6px;

            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .submit-button {
            width: 100%;

            margin-top: 20px;
            padding: 12px;

            background-color: #0f4c81;
            color: white;

            border: none;
            border-radius: 5px;

        }

        .submit-button:hover {
            background-color: #083358;
        }

        .close-button {
            position: absolute;

            top: 10px;
            right: 15px;

            border: none;
            background: none;

            font-size: 25px;
            cursor: pointer;

            color: #555;
        }

        .close-button:hover {
            color: red;
        }

    </style>

</head>

<body>
    <button
        class="login-button"
        aria-label="Open login form">

        Login

    </button>


    <div class="modal">

        <div
            class="login-dialog"
            role="dialog"
            aria-modal="true"
            aria-labelledby="login-title">

            <button
                class="close-button"
                aria-label="Close login dialog">

                &times;

            </button>

            <h2 id="login-title">
                Login
            </h2>

            <form>

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required>


                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required>


                <button
                    type="submit"
                    class="submit-button">

                    Login

                </button>

            </form>

        </div>

    </div>

</body>

</html>
