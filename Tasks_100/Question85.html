
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>API Pagination</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            padding: 45px 20px;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .container {
            max-width: 850px;
            margin: auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 35px;
        }

        .header h1 {
            font-size: 38px;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 16px;
            opacity: 0.9;
        }

        #loader {
            display: none;
            text-align: center;
            color: white;
            padding: 25px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        #error {
            display: none;
            background: #fff0f0;
            color: #c62828;
            text-align: center;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        #users {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .user {
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
            transition: 0.3s;
        }

        .user:hover {
            transform: translateY(-5px);
            box-shadow: 0 14px 30px rgba(0, 0, 0, 0.2);
        }

        .avatar {
            width: 55px;
            height: 55px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-size: 23px;
            font-weight: bold;
            margin-bottom: 16px;
        }

        .user h3 {
            color: #333;
            font-size: 20px;
            margin-bottom: 15px;
        }

        .user p {
            color: #666;
            font-size: 14px;
            margin-bottom: 10px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .user p span {
            color: #764ba2;
            font-weight: bold;
        }

        .user-id {
            display: inline-block;
            background: #f0edff;
            color: #764ba2;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            margin-top: 5px;
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 35px;
        }

        button {
            padding: 12px 22px;
            border: none;
            border-radius: 9px;
            background: white;
            color: #764ba2;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover:not(:disabled) {
            background: #f0edff;
            transform: translateY(-2px);
        }

        button:disabled {
            background: #d1d1d1;
            color: #777;
            cursor: not-allowed;
        }

        #pageInfo {
            color: white;
            font-size: 15px;
            font-weight: bold;
            min-width: 100px;
            text-align: center;
        }

        #status {
            text-align: center;
            color: white;
            margin-top: 25px;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            body {
                padding: 30px 15px;
            }

            .header h1 {
                font-size: 30px;
            }

            #users {
                grid-template-columns: 1fr;
            }

            .pagination {
                gap: 10px;
            }

            button {
                padding: 10px 14px;
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>User Directory</h1>
            <p>Explore users with API pagination</p>
        </div>

        <div id="loader">
            <div class="spinner"></div>
            Loading users...
        </div>

        <p id="error" role="alert"></p>

        <div id="users"></div>

        <div class="pagination">
            <button id="prevBtn" disabled>← Previous</button>

            <span id="pageInfo">Page 1</span>

            <button id="nextBtn" disabled>Next →</button>
        </div>

        <p id="status"></p>

    </div>

    <script>
        let usersContainer = document.getElementById("users");
        let loader = document.getElementById("loader");
        let error = document.getElementById("error");
        let status = document.getElementById("status");

        let prevBtn = document.getElementById("prevBtn");
        let nextBtn = document.getElementById("nextBtn");
        let pageInfo = document.getElementById("pageInfo");

        let currentPage = 1;
        let limit = 15;
        let totalUsers = 0;

        async function fetchUsers() {

            loader.style.display = "block";
            usersContainer.innerHTML = "";
            error.style.display = "none";
            status.innerText = "";

            prevBtn.disabled = true;
            nextBtn.disabled = true;

            let skip = (currentPage - 1) * limit;

            try {
                let response = await fetch(
                    `https://dummyjson.com/users?limit=${limit}&skip=${skip}`
                );

                if (!response.ok) {
                    throw new Error("Failed to load users");
                }

                let data = await response.json();

                totalUsers = data.total;

                data.users.forEach(function(user) {

                    let div = document.createElement("div");
                    div.className = "user";

                    div.innerHTML = `
                        <div class="avatar">
                            ${user.firstName.charAt(0).toUpperCase()}
                        </div>

                        <h3>${user.firstName} ${user.lastName}</h3>

                        <p>
                            <span>Email:</span> ${user.email}
                        </p>

                        <p>
                            <span>Age:</span> ${user.age} years
                        </p>

                        <span class="user-id">User ID: ${user.id}</span>
                    `;

                    usersContainer.appendChild(div);
                });

                let totalPages = Math.ceil(totalUsers / limit);

                pageInfo.innerText =
                    `Page ${currentPage} of ${totalPages}`;

                status.innerText =
                    `Showing ${skip + 1}–${skip + data.users.length} users`;

                prevBtn.disabled = currentPage === 1;

                nextBtn.disabled =
                    skip + data.users.length >= totalUsers;

            } catch (err) {

                error.innerText =
                    "Unable to load users. Please try again.";

                error.style.display = "block";

                console.log("Error:", err);

            } finally {

                loader.style.display = "none";
            }
        }

        nextBtn.addEventListener("click", function() {
            currentPage++;
            fetchUsers();
        });

        prevBtn.addEventListener("click", function() {

            if (currentPage > 1) {
                currentPage--;
                fetchUsers();
            }
        });

        fetchUsers();
    </script>

</body>

</html>
