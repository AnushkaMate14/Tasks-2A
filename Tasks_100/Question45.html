<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .todo-card {
            background: white;
            width: 500px;
            max-width: 100%;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }

        .todo-icon {
            text-align: center;
            font-size: 45px;
            margin-bottom: 12px;
        }

        h2 {
            text-align: center;
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .description {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        input {
            flex: 1;
            min-width: 0;
            padding: 13px;
            border: 2px solid #ddd;
            border-radius: 9px;
            outline: none;
            font-size: 15px;
            transition: 0.3s;
        }

        input:focus {
            border-color: #667eea;
            box-shadow: 0 0 6px rgba(102, 126, 234, 0.2);
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .add-btn {
            background: #667eea;
            color: white;
            padding: 0 20px;
        }

        .add-btn:hover {
            background: #4f46e5;
        }

        #todoList {
            list-style: none;
        }

        #todoList li {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px;
            margin-bottom: 12px;
            background: #f7f8fc;
            border: 1px solid #e8eaf3;
            border-radius: 10px;
            color: #444;
            overflow-wrap: anywhere;
        }

        .task-text {
            flex: 1;
            min-width: 0;
            line-height: 1.5;
        }

        .edit-btn {
            background: #fff0c2;
            color: #9a6700;
        }

        .edit-btn:hover {
            background: #ffe08a;
        }

        .delete-btn {
            background: #fee2e2;
            color: #dc2626;
        }

        .delete-btn:hover {
            background: #fecaca;
        }

        .empty-message {
            text-align: center;
            color: #aaa;
            font-size: 14px;
            padding: 15px 0;
        }

        @media (max-width: 450px) {
            .todo-card {
                padding: 25px 18px;
            }

            .input-group {
                gap: 6px;
            }

            .add-btn {
                padding: 0 13px;
            }

            #todoList li {
                flex-wrap: wrap;
            }

            .task-text {
                flex-basis: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="todo-card">

        <div class="todo-icon">📝</div>

        <h2>My Todo List</h2>

        <p class="description">Organize your tasks, one step at a time.</p>

        <div class="input-group">
            <input type="text" id="todoInput" placeholder="Enter your task...">
            <button class="add-btn" onclick="addTodo()">+ Add</button>
        </div>

        <ul id="todoList">
            <p class="empty-message" id="emptyMessage">No tasks yet. Add your first task!</p>
        </ul>

    </div>

    <script>
        function addTodo() {

            let input = document.getElementById("todoInput");
            let task = input.value.trim();

            if (task === "") {
                return;
            }

            let li = document.createElement("li");
            let taskText = document.createElement("span");

            taskText.className = "task-text";
            taskText.innerText = task;

            // Update
            let editButton = document.createElement("button");
            editButton.innerText = "Edit";
            editButton.className = "edit-btn";

            editButton.onclick = function () {
                let newTask = prompt("Edit task:", task);

                if (newTask !== null && newTask.trim() !== "") {
                    task = newTask.trim();
                    taskText.innerText = task;
                }
            };

            // Delete
            let deleteButton = document.createElement("button");
            deleteButton.innerText = "Delete";
            deleteButton.className = "delete-btn";

            deleteButton.onclick = function () {
                li.remove();
                showEmptyMessage();
            };

            // Create + Read
            li.appendChild(taskText);
            li.appendChild(editButton);
            li.appendChild(deleteButton);

            document.getElementById("todoList").appendChild(li);

            input.value = "";
            showEmptyMessage();
        }

        function showEmptyMessage() {
            let list = document.getElementById("todoList");
            let message = document.getElementById("emptyMessage");

            if (list.querySelectorAll("li").length === 0) {
                message.style.display = "block";
            } else {
                message.style.display = "none";
            }
        }
    </script>

</body>

</html>
