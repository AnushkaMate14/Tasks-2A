
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>API Product Search</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            padding: 45px 20px;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .container {
            max-width: 1150px;
            margin: auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 35px;
        }

        .header h1 {
            font-size: 38px;
            margin-bottom: 12px;
        }

        .header p {
            font-size: 16px;
            opacity: 0.9;
        }

        .search-box {
            display: flex;
            justify-content: center;
            gap: 12px;
            max-width: 600px;
            margin: 0 auto 30px;
        }

        input {
            flex: 1;
            min-width: 0;
            padding: 15px 18px;
            border: 2px solid transparent;
            border-radius: 12px;
            outline: none;
            font-size: 15px;
            background: white;
            transition: 0.3s;
        }

        input:focus {
            border-color: #ffd060;
            box-shadow: 0 0 0 4px rgba(255, 208, 96, 0.2);
        }

        button {
            padding: 14px 24px;
            border: none;
            border-radius: 12px;
            background: #ffd060;
            color: #3e1f55;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover:not(:disabled) {
            background: #ffbd35;
            transform: translateY(-2px);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #loader {
            display: none;
            text-align: center;
            color: white;
            padding: 25px;
        }

        .spinner {
            width: 38px;
            height: 38px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        #message {
            text-align: center;
            color: white;
            font-size: 16px;
            margin: 20px 0;
        }

        #products {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 24px;
        }

        .product {
            position: relative;
            background: white;
            padding: 18px;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
            transition: 0.3s;
            overflow: hidden;
        }

        .product:hover {
            transform: translateY(-7px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.22);
        }

        .image-box {
            height: 190px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 18px;
            background: #f8f7ff;
            border-radius: 12px;
            overflow: hidden;
        }

        .product img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 10px;
            transition: transform 0.3s;
        }

        .product:hover img {
            transform: scale(1.07);
        }

        .product h3 {
            color: #333;
            font-size: 17px;
            line-height: 1.4;
            margin-bottom: 12px;
        }

        .category {
            display: inline-block;
            background: #f0edff;
            color: #764ba2;
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 12px;
            margin-bottom: 15px;
        }

        .price {
            color: #764ba2;
            font-size: 22px;
            font-weight: bold;
        }

        @media (max-width: 950px) {
            #products {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }
        }

        @media (max-width: 700px) {
            #products {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 16px;
            }

            .header h1 {
                font-size: 30px;
            }

            .image-box {
                height: 160px;
            }
        }

        @media (max-width: 450px) {
            body {
                padding: 30px 14px;
            }

            .search-box {
                gap: 8px;
            }

            input {
                padding: 12px;
                font-size: 14px;
            }

            button {
                padding: 12px 14px;
                font-size: 14px;
            }

            #products {
                grid-template-columns: 1fr;
            }

            .image-box {
                height: 210px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>Product Search</h1>
            <p>Find your favourite products using Fetch API</p>
        </div>

        <div class="search-box">
            <input
                type="text"
                id="searchInput"
                placeholder="Search products..."
                aria-label="Search products"
            >

            <button id="searchBtn">Search</button>
        </div>

        <div id="loader">
            <div class="spinner"></div>
            Searching products...
        </div>

        <p id="message" role="status">Search for a product to get started.</p>

        <div id="products"></div>

    </div>

    <script>
        let searchInput = document.getElementById("searchInput");
        let searchBtn = document.getElementById("searchBtn");
        let products = document.getElementById("products");
        let loader = document.getElementById("loader");
        let message = document.getElementById("message");

        searchBtn.addEventListener("click", searchProducts);

        searchInput.addEventListener("keydown", function(event) {
            if (event.key === "Enter") {
                searchProducts();
            }
        });

        async function searchProducts() {

            let query = searchInput.value.trim();

            if (query === "") {
                message.innerText = "Please enter a product name.";
                products.innerHTML = "";
                return;
            }

            loader.style.display = "block";
            message.innerText = "";
            products.innerHTML = "";
            searchBtn.disabled = true;

            try {
                let response = await fetch(
                    `https://dummyjson.com/products/search?q=${encodeURIComponent(query)}`
                );

                if (!response.ok) {
                    throw new Error("Failed to fetch products");
                }

                let data = await response.json();

                if (data.products.length === 0) {
                    message.innerText = "No products found. Try another search.";
                    return;
                }

                message.innerText =
                    `${data.products.length} products found for "${query}"`;

                data.products.forEach(function(product) {

                    let div = document.createElement("div");
                    div.className = "product";

                    div.innerHTML = `
                        <div class="image-box">
                            <img
                                src="${product.thumbnail}"
                                alt="${product.title}"
                                loading="lazy"
                            >
                        </div>

                        <h3>${product.title}</h3>

                        <span class="category">
                            ${product.category}
                        </span>

                        <p class="price">$${product.price.toFixed(2)}</p>
                    `;

                    products.appendChild(div);
                });

            } catch (err) {
                message.innerText =
                    "Something went wrong. Please try again.";

                console.log("Error:", err);

            } finally {
                loader.style.display = "none";
                searchBtn.disabled = false;
            }
        }
    </script>

</body>

</html>
