
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
<style>
body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #74b9ff, #a29bfe);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
}

.weather-card {
    background: white;
    width: 100%;
    max-width: 450px;
    padding: 30px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
}

h1 {
    margin-bottom: 25px;
}

.search-box {
    display: flex;
    gap: 8px;
}

.search-box input {
    min-width: 0;
    flex: 1;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 8px;
}

.search-box button {
    padding: 10px 15px;
    border: none;
    border-radius: 8px;
    background: #0984e3;
    color: white;
    cursor: pointer;
}

.weather-icon {
    font-size: 55px;
}

#temperature {
    font-size: 38px;
    font-weight: bold;
}

.details {
    background: #f1f5f9;
    padding: 12px;
    border-radius: 10px;
    margin-top: 20px;
}

.details p {
    margin: 8px 0;
}
</style>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <div class="container">
        <div class="weather-card">
            <h1>Weather App</h1>

            <div class="search-box">
                <input type="text" id="city" placeholder="Enter city name">
                <button id="searchBtn">Search</button>
            </div>

            <div id="loader" class="text-center my-3" style="display: none;">
                <div class="spinner-border text-primary"></div>
                <p>Loading weather...</p>
            </div>

            <p id="error" class="text-danger"></p>

            <div id="weather" style="display: none;">
                <h2 id="cityName"></h2>
                <div id="icon" class="weather-icon"></div>
                <h3 id="temperature"></h3>
                <p id="condition"></p>

                <div class="details">
                    <p>Humidity: <span id="humidity"></span>%</p>
                    <p>Wind Speed: <span id="wind"></span> km/h</p>
                </div>
            </div>
        </div>
    </div>

    <script>
let cityInput = document.getElementById("city");
let searchBtn = document.getElementById("searchBtn");
let loader = document.getElementById("loader");
let error = document.getElementById("error");
let weather = document.getElementById("weather");

searchBtn.addEventListener("click", getWeather);

cityInput.addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        getWeather();
    }
});

async function getWeather() {
    let city = cityInput.value.trim();

    if (city === "") {
        error.innerText = "Please enter a city name.";
        weather.style.display = "none";
        return;
    }

    loader.style.display = "block";
    error.innerText = "";
    weather.style.display = "none";
    searchBtn.disabled = true;

    try {
        // Step 1: Find city coordinates
        let cityResponse = await fetch(
            `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=en&format=json`
        );

        if (!cityResponse.ok) {
            throw new Error("Unable to search city.");
        }

        let cityData = await cityResponse.json();

        if (!cityData.results || cityData.results.length === 0) {
            throw new Error("City not found. Please try another name.");
        }

        let location = cityData.results[0];

        // Step 2: Get weather using coordinates
        let weatherResponse = await fetch(
            `https://api.open-meteo.com/v1/forecast?latitude=${location.latitude}&longitude=${location.longitude}&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,weather_code,wind_speed_10m`
        );

        if (!weatherResponse.ok) {
            throw new Error("Unable to fetch weather.");
        }

        let weatherData = await weatherResponse.json();
        let current = weatherData.current;

        // Step 3: Display weather
        document.getElementById("cityName").innerText =
            location.name + ", " + location.country;

        document.getElementById("temperature").innerText =
            current.temperature_2m + "°C";

        document.getElementById("humidity").innerText =
            current.relative_humidity_2m;

        document.getElementById("wind").innerText =
            current.wind_speed_10m;

        document.getElementById("condition").innerText =
            getCondition(current.weather_code);

        document.getElementById("icon").innerText =
            getIcon(current.weather_code, current.is_day);

        weather.style.display = "block";

    } catch (err) {
        error.innerText = err.message;
    } finally {
        loader.style.display = "none";
        searchBtn.disabled = false;
    }
}

function getCondition(code) {
    if (code === 0) return "Clear sky";
    if (code <= 3) return "Partly cloudy";
    if (code <= 48) return "Foggy";
    if (code <= 57) return "Drizzle";
    if (code <= 67) return "Rainy";
    if (code <= 77) return "Snowy";
    if (code <= 82) return "Rain showers";
    if (code <= 86) return "Snow showers";
    if (code <= 99) return "Thunderstorm";

    return "Unknown condition";
}

function getIcon(code, isDay) {
    if (code === 0) return isDay ? "☀️" : "🌙";
    if (code <= 3) return "⛅";
    if (code <= 48) return "🌫️";
    if (code <= 67) return "🌧️";
    if (code <= 77) return "❄️";
    if (code <= 82) return "🌦️";
    if (code <= 86) return "🌨️";
    if (code <= 99) return "⛈️";

    return "🌡️";
}
</script>
</body>
</html>
