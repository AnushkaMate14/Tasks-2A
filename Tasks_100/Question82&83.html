
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>API Error Handling</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 45px 20px;
        }

        .container {
            max-width: 1100px;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 35px;
        }

        .header h1 {
            font-size: 38px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 16px;
            opacity: 0.9;
        }

        #loader {
            text-align: center;
            color: white;
            padding: 40px 0;
        }

        #loader .spinner-border {
            width: 3rem;
            height: 3rem;
            border-width: 5px;
        }

        #loader p {
            margin-top: 15px;
            font-size: 16px;
        }

        #error {
            display: none;
            max-width: 600px;
            margin: 20px auto;
            padding: 20px;
            text-align: center;
            background: #fff0f0;
            color: #c62828;
            border-radius: 12px;
            font-size: 16px;
        }

        #users {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 22px;
        }

        .user-card {
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
            transition: 0.3s;
        }

        .user-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 14px 30px rgba(0, 0, 0, 0.2);
        }

        .avatar {
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 18px;
        }

        .user-card h3 {
            color: #333;
            font-size: 21px;
            margin-bottom: 18px;
        }

        .user-card p {
            color: #666;
            font-size: 14px;
            margin-bottom: 12px;
            overflow-wrap: anywhere;
        }

        .user-card p span {
            color: #764ba2;
            font-weight: bold;
        }

        .user-id {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            background: #f0edff;
            color: #764ba2;
            font-size: 12px;
            margin-top: 5px;
        }

        #status {
            text-align: center;
            color: white;
            margin-bottom: 25px;
            font-size: 16px;
        }

        @media (max-width: 850px) {
            #users {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 550px) {
            body {
                padding: 30px 15px;
            }

            .header h1 {
                font-size: 30px;
            }

            #users {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>Users Dashboard</h1>
            <p>Fetch API with Loading and Error Handling</p>
        </div>

        <div id="loader">
            <div class="spinner-border text-light" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p>Loading users, please wait...</p>
        </div>

        <div id="error" role="alert"></div>

        <p id="status"></p>

        <div id="users"></div>

    </div>

    <script>
        let loader = document.getElementById("loader");
        let users = document.getElementById("users");
        let error = document.getElementById("error");
        let status = document.getElementById("status");

        fetch("https://dummyjson.com/users")

            .then(response => {

                if (!response.ok) {
                    throw new Error("Failed to fetch users");
                }

                return response.json();
            })

            .then(data => {

                setTimeout(function() {

                    loader.style.display = "none";

                    status.innerText = data.users.length + " users loaded successfully";

                    data.users.forEach(function(user) {

                        let div = document.createElement("div");
                        div.classList.add("user-card");

                        div.innerHTML = `
                            <div class="avatar">
                                ${user.firstName.charAt(0).toUpperCase()}
                            </div>

                            <h3>${user.firstName} ${user.lastName}</h3>

                            <p>
                                <span>Email:</span> ${user.email}
                            </p>

                            <p>
                                <span>Age:</span> ${user.age} years
                            </p>

                            <span class="user-id">User ID: ${user.id}</span>
                        `;

                        users.appendChild(div);
                    });

                }, 2000);

            })

            .catch(function(err) {

                loader.style.display = "none";

                error.style.display = "block";
                error.innerText = "Something went wrong. Please try again.";

                console.log("Error:", err);
            });
    </script>

</body>

</html>
