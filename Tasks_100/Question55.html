
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Search</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .container {
            width: 500px;
            max-width: 100%;
            padding: 35px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }

        .icon {
            text-align: center;
            font-size: 45px;
            margin-bottom: 12px;
        }

        h2 {
            text-align: center;
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .description {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .search-box {
            position: relative;
            margin-bottom: 25px;
        }

        .search-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
        }

        #search {
            width: 100%;
            padding: 14px 15px 14px 45px;
            border: 2px solid #ddd;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
            transition: 0.3s;
        }

        #search:focus {
            border-color: #667eea;
            box-shadow: 0 0 8px rgba(102, 126, 234, 0.2);
        }

        .list-heading {
            color: #555;
            font-size: 15px;
            margin-bottom: 12px;
        }

        #products {
            list-style: none;
        }

        #products li {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 15px;
            margin-bottom: 10px;
            background: #f7f7ff;
            border: 1px solid #eceaff;
            border-radius: 10px;
            color: #444;
            font-size: 15px;
            transition: 0.3s;
        }

        #products li:hover {
            background: #eeeaff;
            border-color: #c4b5fd;
            transform: translateX(4px);
        }

        .product-icon {
            font-size: 22px;
        }

        #noResults {
            display: none;
            text-align: center;
            color: #999;
            padding: 20px 10px;
            font-size: 14px;
        }

        .footer {
            text-align: center;
            color: #aaa;
            font-size: 12px;
            margin-top: 20px;
        }

        @media (max-width: 450px) {
            .container {
                padding: 25px 18px;
            }

            h2 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="icon">🛍️</div>

        <h2>Search Products</h2>

        <p class="description">
            Find your favourite fruit by typing its name below.
        </p>

        <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" id="search" placeholder="Search products...">
        </div>

        <h3 class="list-heading">Available Products</h3>

        <ul id="products">
            <li><span class="product-icon">🍎</span> Apple</li>
            <li><span class="product-icon">🍌</span> Banana</li>
            <li><span class="product-icon">🍊</span> Orange</li>
            <li><span class="product-icon">🥭</span> Mango</li>
            <li><span class="product-icon">🍇</span> Grapes</li>
        </ul>

        <p id="noResults">😕 No matching products found!</p>

        <p class="footer">Results update instantly as you type ✨</p>

    </div>

    <script>
        let search = document.getElementById("search");
        let products = document.querySelectorAll("#products li");
        let noResults = document.getElementById("noResults");

        search.addEventListener("input", function() {

            let value = search.value.toLowerCase();
            let visibleCount = 0;

            products.forEach(function(product) {

                if (product.innerText.toLowerCase().includes(value)) {
                    product.style.display = "";
                    visibleCount++;
                } else {
                    product.style.display = "none";
                }

            });

            noResults.style.display = visibleCount === 0 ? "block" : "none";

        });
    </script>

</body>
</html>
