<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <title>Bootstrap Grid Layout</title>
</head>

    <div class="row g-3">

        <div class="col-4">
            <div class="border border-primary border-3 bg-light text-primary p-5 text-center h-100">
                1
            </div>
        </div>

        <div class="col-8">
            <div class="row g-3">
                
                <div class="col-12">
                    <div class="border border-primary border-3 bg-light text-primary p-4 text-center">
                        2
                    </div>
                </div>

                <div class="col-12">
                    <div class="border border-primary border-3 bg-light text-primary p-4 text-center">
                        3
                    </div>
                </div>

            </div>

        </div>

    </div>

    <div class="row g-3 mt-1">

        <div class="col-3">
            <div class="border border-primary border-3 bg-light text-primary p-5 text-center">
                4
            </div>
        </div>

        <div class="col-3">
            <div class="border border-primary border-3 bg-light text-primary p-5 text-center">
                5
            </div>
        </div>

        <div class="col-3">
            <div class="border border-primary border-3 bg-light text-primary p-5 text-center">
                6
            </div>
        </div>

        <div class="col-3">
            <div class="border border-primary border-3 bg-light text-primary p-5 text-center">
                7
            </div>
        </div>

    </div>


    <div class="row g-3 mt-1">

        <div class="col-4">
            <div class="border border-primary border-3 bg-light text-primary p-5 text-center h-100">
                8
            </div>
        </div>

        <div class="col-4">

            <div class="row g-3">

                <div class="col-12">
                    <div class="border border-primary border-3 bg-light text-primary p-3 text-center">
                        9
                    </div>
                </div>

                <div class="col-12">
                    <div class="border border-primary border-3 bg-light text-primary p-3 text-center">
                        10
                    </div>
                </div>

            </div>

        </div>

        <div class="col-4">
            <div class="border border-primary border-3 bg-light text-primary p-5 text-center h-100">
                11
            </div>
        </div>

    </div>

</div>
</div>

</html>
